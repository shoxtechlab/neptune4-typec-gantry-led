[gcode_shell_command GANTRY_LED_ON_CMD]
command: sh /home/mks/gantry-led-on.sh
timeout: 5.
verbose: True

[gcode_shell_command GANTRY_LED_OFF_CMD]
command: sh /home/mks/gantry-led-off.sh
timeout: 5.
verbose: True

[gcode_macro GANTRY_LED_ON]
description: Turn the upper gantry LED on
gcode:
  RUN_SHELL_COMMAND CMD=GANTRY_LED_ON_CMD

[gcode_macro GANTRY_LED_OFF]
description: Turn the upper gantry LED off
gcode:
  RUN_SHELL_COMMAND CMD=GANTRY_LED_OFF_CMD
