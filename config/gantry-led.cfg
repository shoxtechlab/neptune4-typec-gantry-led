# Requires the gcode_shell_command Klipper extension.
[gcode_shell_command TOGGLE_GANTRY_LED]
command: sh /home/mks/sled2.sh
timeout: 5.
verbose: True

[gcode_macro GANTRY_LED_TOGGLE]
description: Toggle the upper gantry LED on a tested Neptune 4 Plus Type-C
gcode:
  RUN_SHELL_COMMAND CMD=TOGGLE_GANTRY_LED
